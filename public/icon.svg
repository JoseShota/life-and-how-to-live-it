<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Thermae app icon: a tiled wall, one arch open onto a pale dream sky, still pool water.
       Full-bleed square; all artwork sits inside the central 80 % so it also works as a maskable icon. -->
  <defs>
    <pattern id="tile" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#e4ebe7"/>
      <path d="M0 .5H64M.5 0V64" stroke="#d6dfdb" stroke-width="2"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2e8"/>
      <stop offset="1" stop-color="#fbfaf6"/>
    </linearGradient>
    <clipPath id="opening"><path d="M168 400V212a88 88 0 0 1 176 0V400Z"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
  <!-- marble frame of the arch -->
  <path d="M136 400V212a120 120 0 0 1 240 0V400Z" fill="#fbfaf6" stroke="#2b3437" stroke-width="8" stroke-linejoin="round"/>
  <!-- the opening: sky, a low sun, a cloud, the pool -->
  <g clip-path="url(#opening)">
    <rect x="160" y="100" width="192" height="310" fill="url(#sky)"/>
    <circle cx="296" cy="236" r="26" fill="#ecc7c0"/>
    <ellipse cx="214" cy="190" rx="38" ry="11" fill="#fbfaf6"/>
    <rect x="160" y="320" width="192" height="90" fill="#a6d9d1"/>
    <path d="M176 346c16-8 32-8 48 0s32 8 48 0 32-8 48 0" fill="none" stroke="#fbfaf6" stroke-width="5" stroke-linecap="round"/>
    <path d="M196 374c16-8 32-8 48 0s32 8 48 0" fill="none" stroke="#fbfaf6" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  </g>
  <path d="M168 400V212a88 88 0 0 1 176 0V400" fill="none" stroke="#2b3437" stroke-width="6" stroke-linejoin="round"/>
  <!-- floor ledge -->
  <rect x="128" y="398" width="256" height="14" fill="#d6dfdb" stroke="#2b3437" stroke-width="6" stroke-linejoin="round"/>
</svg>
